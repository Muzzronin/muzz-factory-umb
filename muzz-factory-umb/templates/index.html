<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muzz Factory UMB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #2b2b2b 0%, #1a1a1a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #3c3c3c;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #ffaa00;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #cccccc;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .file-input-wrapper {
            background: #4a4a4a;
            border: 2px dashed #ffaa00;
            border-radius: 10px;
            padding: 30px 20px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-input-wrapper:hover {
            background: #555;
            border-color: #ffcc00;
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            color: #ffaa00;
            font-weight: bold;
            cursor: pointer;
            display: block;
        }
        .file-name {
            color: #888;
            margin-top: 10px;
            font-size: 12px;
        }
        button {
            background: #ffaa00;
            color: #1a1a1a;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            background: #ffcc00;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: none;
            color: #ffaa00;
            margin-top: 20px;
            font-size: 14px;
        }
        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Muzz Factory UMB</h1>
        <p class="subtitle">Generador de Plantillas Papercraft desde skins de Minecraft</p>
        
        <form method="post" action="/generar" enctype="multipart/form-data" id="form-generar">
            <div class="file-input-wrapper" onclick="document.getElementById('skin-input').click()">
                <label for="skin-input" class="file-label">📁 Importar Skin</label>
                <div class="file-name" id="file-name">Ningún archivo seleccionado</div>
                <input type="file" name="skin" id="skin-input" accept="image/png" required>
            </div>
            
            <button type="submit" id="btn-generar" disabled>Generar Plantilla</button>
        </form>
        
        <div class="loading" id="loading">
            ⚙️ Generando plantilla... esto puede tardar unos segundos.
        </div>
    </div>
    
    <script>
        const input = document.getElementById('skin-input');
        const fileName = document.getElementById('file-name');
        const btnGenerar = document.getElementById('btn-generar');
        const form = document.getElementById('form-generar');
        const loading = document.getElementById('loading');
        
        input.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileName.textContent = '✓ ' + this.files[0].name;
                btnGenerar.disabled = false;
            } else {
                fileName.textContent = 'Ningún archivo seleccionado';
                btnGenerar.disabled = true;
            }
        });
        
        form.addEventListener('submit', function() {
            btnGenerar.disabled = true;
            btnGenerar.textContent = 'Generando...';
            loading.classList.add('active');
        });
    </script>
</body>
</html>
